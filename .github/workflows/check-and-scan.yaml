name: Check and Scan
on:
  pull_request:
    branches:
      - main
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm install
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: |
          wget -q https://github.com/betterleaks/betterleaks/releases/download/v1.6.1/betterleaks_1.6.1_linux_x64.tar.gz
          tar -xzf betterleaks_1.6.1_linux_x64.tar.gz
          sudo mv betterleaks /usr/local/bin/
      - run: betterleaks git .

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check if version changed
        id: version-diff
        run: |
          BASE_VERSION=$(git show origin/main:package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version")
          PR_VERSION=$(node -p "require('./package.json').version")
          if [ "$BASE_VERSION" != "$PR_VERSION" ]; then
            echo "Version changed: ${BASE_VERSION} -> ${PR_VERSION}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version unchanged (${PR_VERSION}), skipping npm check."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check version is not already published
        if: steps.version-diff.outputs.changed == 'true'
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")

          echo "Checking if ${PACKAGE_NAME}@${LOCAL_VERSION} exists on npm..."

          if npm view "${PACKAGE_NAME}@${LOCAL_VERSION}" version >/dev/null 2>&1; then
            echo "::error::Version ${LOCAL_VERSION} of ${PACKAGE_NAME} is already published to npm. Bump the version before merging."
            exit 1
          fi

          echo "Version ${LOCAL_VERSION} is not yet published. OK to merge."
